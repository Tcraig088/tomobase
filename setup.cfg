[metadata]
name = tomobase
version = attr: tomobase.__version__
license = None
author = Timothy Craig
author_email = tcraig258@gmail.com
description = A collection of base data types, widgets and  functions for tomography
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Tcraig088/tomobase
project_urls =
    Bug Tracker = https://github.com/Tcraig088/tomobase/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = tomobase
python_requires = >=3.10
include_package_data = True
install_requires =
    numpy >= 2.0
    matplotlib
    scipy
    imageio
    h5py
    mrcz
    makefun
    qtpy
    magicgui
    pandas
    colorama
    scikit-image
    tqdm
    coolname
    xarray
    ncempy
    hvplot

[options.package_data]
tomobase = 
    *.json
    */*.json
    */*/*.json
    */*/*/*.json
    *.pkl
    */*.pkl
    */*/*.pkl
    */*/*/*.pkl
    